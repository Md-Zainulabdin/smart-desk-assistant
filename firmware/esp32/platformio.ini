; Jarvis Smart AI Assistant - ESP-IDF + Slint UI + ESP-SR + Groq (ESP32-S3 N16R8)

[env:4d_systems_esp32s3_gen4_r8n16]
; Pinned: espressif32 >= 7.0 defaults to ESP-IDF 6.x, but this project
; (dependencies.lock, ESP-SR, Slint) is built and tested on ESP-IDF 5.5.5.
; IDF 5.5.5 also requires the esp-14.2.0_20260121 Xtensa compiler (the
; platform would pick GCC 15.2 for IDF-only projects).
platform = espressif32 @ 8.0.0
platform_packages =
    platformio/framework-espidf @ ~4.50505.0
    platformio/toolchain-xtensa-esp-elf @ 14.2.0+20260121
board = 4d_systems_esp32s3_gen4_r8n16
framework = espidf

board_build.partitions = partitions.csv
board_upload.flash_size = 16MB

; pre:  compiles src/ui/*.slint into src/generated/*.h before each build
; post: adds Slint's prebuilt library to the final link
extra_scripts =
    pre:slint_build.py
    post:slint_link.py

; Native USB port: baud rate is ignored, kept for save_audio.py compatibility
monitor_speed = 921600
monitor_filters = esp32_exception_decoder

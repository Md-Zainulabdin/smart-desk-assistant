<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desk Playground</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="dot"></span>
      <strong>Smart Desk</strong>
      <span class="tag">dev playground</span>
    </div>
    <div id="account" class="account">Checking sign-in…</div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main class="layout">
    <section class="chat" aria-label="Assistant">
      <ol id="messages" class="messages">
        <li class="msg bot">
          <p>Hi! Try <em>"Take a note: buy milk"</em>, <em>"Create a note."</em> then answer,
          or <em>"Schedule a project meeting tomorrow at 3 PM"</em>.</p>
        </li>
      </ol>

      <div class="chips" id="chips">
        <button type="button">Take a note: buy milk</button>
        <button type="button">Create a note.</button>
        <button type="button">Schedule a project meeting tomorrow at 3 PM</button>
        <button type="button">Remind me to call mom at 5 PM</button>
      </div>

      <form id="composer" class="composer">
        <input id="text" type="text" autocomplete="off" maxlength="2000"
               placeholder="Say something to the assistant…" required>
        <button id="send" type="submit">Send</button>
      </form>
      <p class="hint">Timezone: <span id="tz"></span> · each message gets a new <code>request_id</code></p>
    </section>

    <aside class="side" aria-label="Notes">
      <div class="side-head">
        <h2>Your notes</h2>
        <button id="refresh" type="button" class="ghost">Refresh</button>
      </div>
      <ul id="notes" class="notes"><li class="muted">Sign in to see notes.</li></ul>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>

[project]
name = "desk-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "authlib>=1.9.1",
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "google-api-python-client>=2.201.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "starlette>=1.6.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100

# Let FastAPI's `conn=Depends(get_db)` style pass lint.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]

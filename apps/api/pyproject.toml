[project]
name = "desk-api"
version = "0.1.0"
description = "Smart Desk Assistant FastAPI backend"
requires-python = ">=3.14"
dependencies = [
    "authlib>=1.3",
    "cryptography>=44",
    "fastapi>=0.141.1",
    "fastapi-cli>=0.0.32",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.40",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.53.0",
    "yoyo-migrations>=9.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100

# Let FastAPI's `conn=Depends(get_db)` style pass lint.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]

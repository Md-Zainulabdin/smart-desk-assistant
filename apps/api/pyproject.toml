# Python backend (apps/api). Run uv commands from apps/api.
[project]
name = "smart-desk-api"
version = "0.1.0"
description = "Smart Desk Assistant FastAPI backend"
authors = [
    { name = "umerfaisall", email = "faisalumr445@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "authlib>=1.3",
    "fastapi>=0.115",
    "fastapi-cli>=0.0.32",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.4",
    "uvicorn[standard]>=0.30",
    "yoyo-migrations>=9.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
